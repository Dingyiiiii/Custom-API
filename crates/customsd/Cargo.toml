[package]
name = "customsd"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Custom-API customs proxy daemon"

[[bin]]
name = "customsd"
path = "src/main.rs"

[dependencies]
customapi-core = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true }
clap = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }

[dev-dependencies]
# The CLI tests signal the daemon directly; shelling out to `kill` would make them
# depend on procps being installed (a slim container has no /bin/kill).
libc = { workspace = true }
